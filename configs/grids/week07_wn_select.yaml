# Step 4.1 weight-noise comparator, sigma selection at seed 0 (D34, D45).
# Gupta et al. (2026) add N(0, 0.5^2) to client weights without clipping. sigma 0.5 is kept
# as the literal setting; scripts/make_shadow_grid.py wn picks one utility-matched sigma by a
# fixed rule against epsilon 8 FedAvg on natural3 at seed 0.
name: week07_wn_select
fixed:
  data: {scenario: natural3}
  optim: {lr: 0.01}
  train: {seed: 0}
axes:
  fl.weight_noise: [0.5, 0.05, 0.01, 0.003, 0.001]
