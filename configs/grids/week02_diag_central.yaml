# Step 2.4 part A. Centralised capacity ceiling, with and without DP.
# Separates "the model cannot learn this" from "federation breaks it".
name: week02_diag_central
fixed:
  fl: {mode: central, rounds: 100}
  optim: {momentum: 0.9}
presets:
  - {model: {name: small_cnn, width: 16}}
  - {model: {name: small_cnn, width: 32}}
  - {model: {name: resnet18_frozenbn, pretrained: true}, dp: {max_physical_batch: 32}}
axes:
  optim.lr: [0.01, 0.05]
  dp.target_epsilon: [null, 8.0]
rules:
  dp.target_epsilon:
    8.0: {dp: {enabled: true}}
